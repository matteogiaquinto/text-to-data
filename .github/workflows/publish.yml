name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish when this version is not already on npm
        shell: bash
        run: |
          package_name="$(node -p \"require('./package.json').name\")"
          package_version="$(node -p \"require('./package.json').version\")"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org; then
            echo "${package_name}@${package_version} is already published; skipping."
          else
            npm publish --access public
          fi
